<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">LEARN IT → DO IT → PITCH IT</title><desc id="d">Three glowing hexagons connected by a moving signal: Learn it, Do it, Pitch it. Below: There are no limits to what we can do.</desc>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.flk{animation:flk 3.4s steps(1) infinite}
@keyframes flk{0%{opacity:.55}6%{opacity:.12}8%{opacity:.65}52%{opacity:.5}55%{opacity:.1}58%{opacity:.6}100%{opacity:.55}}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
</style>

<rect width="1200" height="380" fill="#05070d"/>
<rect width="1200" height="380" fill="url(#scan)"/>
<line x1="300" y1="150" x2="488" y2="150" stroke="#00e5ff" stroke-width="3" stroke-dasharray="10 8" class="dash"/><polygon points="500,150 484,141 484,159" fill="#00e5ff"/><line x1="700" y1="150" x2="888" y2="150" stroke="#39ff14" stroke-width="3" stroke-dasharray="10 8" class="dash"/><polygon points="900,150 884,141 884,159" fill="#39ff14"/>
<polygon points="312.0,150.0 256.0,247.0 144.0,247.0 88.0,150.0 144.0,53.0 256.0,53.0" fill="none" stroke="#00e5ff" stroke-opacity=".6" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" from="0 200 150" to="360 200 150" dur="30s" repeatCount="indefinite"/></polygon>
<polygon points="292.0,150.0 246.0,229.7 154.0,229.7 108.0,150.0 154.0,70.3 246.0,70.3" fill="#00e5ff" fill-opacity=".09" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow2)"/>
<text x="200" y="159" font-size="25" font-weight="800" text-anchor="middle" fill="#00e5ff" letter-spacing="1">LEARN IT</text>
<text x="200" y="30" font-size="15" text-anchor="middle" fill="#00e5ff" fill-opacity=".8">NODE_01</text>
<text x="200" y="290" font-size="18" text-anchor="middle" fill="#a9bdd0">// absorb</text>
<polygon points="712.0,150.0 656.0,247.0 544.0,247.0 488.0,150.0 544.0,53.0 656.0,53.0" fill="none" stroke="#39ff14" stroke-opacity=".6" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" from="0 600 150" to="360 600 150" dur="30s" repeatCount="indefinite"/></polygon>
<polygon points="692.0,150.0 646.0,229.7 554.0,229.7 508.0,150.0 554.0,70.3 646.0,70.3" fill="#39ff14" fill-opacity=".09" stroke="#39ff14" stroke-width="2.5" filter="url(#glow2)"/>
<text x="600" y="159" font-size="25" font-weight="800" text-anchor="middle" fill="#39ff14" letter-spacing="1">DO IT</text>
<text x="600" y="30" font-size="15" text-anchor="middle" fill="#39ff14" fill-opacity=".8">NODE_02</text>
<text x="600" y="290" font-size="18" text-anchor="middle" fill="#a9bdd0">// build</text>
<polygon points="1112.0,150.0 1056.0,247.0 944.0,247.0 888.0,150.0 944.0,53.0 1056.0,53.0" fill="none" stroke="#a855f7" stroke-opacity=".6" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" from="0 1000 150" to="360 1000 150" dur="30s" repeatCount="indefinite"/></polygon>
<polygon points="1092.0,150.0 1046.0,229.7 954.0,229.7 908.0,150.0 954.0,70.3 1046.0,70.3" fill="#a855f7" fill-opacity=".09" stroke="#a855f7" stroke-width="2.5" filter="url(#glow2)"/>
<text x="1000" y="159" font-size="25" font-weight="800" text-anchor="middle" fill="#a855f7" letter-spacing="1">PITCH IT</text>
<text x="1000" y="30" font-size="15" text-anchor="middle" fill="#a855f7" fill-opacity=".8">NODE_03</text>
<text x="1000" y="290" font-size="18" text-anchor="middle" fill="#a9bdd0">// convince</text>

<circle r="7" fill="#fff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M200,150 L1000,150"/></circle>
<line x1="60" y1="318" x2="1140" y2="318" stroke="#39ff14" stroke-opacity=".4"/>
<text x="604" y="362" font-size="35" font-weight="800" text-anchor="middle" fill="#a855f7" opacity=".85" letter-spacing="1">THERE ARE NO LIMITS TO WHAT WE CAN DO.</text>
<text x="596" y="362" font-size="35" font-weight="800" text-anchor="middle" fill="#00e5ff" opacity=".85" letter-spacing="1">THERE ARE NO LIMITS TO WHAT WE CAN DO.</text>
<text x="600" y="362" font-size="35" font-weight="800" text-anchor="middle" fill="#39ff14" letter-spacing="1">THERE ARE NO LIMITS TO WHAT WE CAN DO.</text>

