<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">CSIA terminal sign-off</title><desc id="d">A terminal prints the slogan: Shield up. Minds on. Together we rise. Signal stays open, welcome to the mesh.</desc>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.flk{animation:flk 3.4s steps(1) infinite}
@keyframes flk{0%{opacity:.55}6%{opacity:.12}8%{opacity:.65}52%{opacity:.5}55%{opacity:.1}58%{opacity:.6}100%{opacity:.55}}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}

.t1{animation:t1 9s steps(1) infinite}@keyframes t1{0%,5%{opacity:0}6%,95%{opacity:1}100%{opacity:0}}
.t2{animation:t2 9s steps(1) infinite}@keyframes t2{0%,30%{opacity:0}31%,95%{opacity:1}100%{opacity:0}}
.t3{animation:t3 9s steps(1) infinite}@keyframes t3{0%,55%{opacity:0}56%,95%{opacity:1}100%{opacity:0}}
</style>

<rect width="1200" height="260" fill="#060912"/>
<rect width="1200" height="260" fill="url(#scan)"/>
<text x="50" y="58" font-size="16" fill="#39ff14" xml:space="preserve" opacity=".9">      .-----------------.</text><text x="50" y="78" font-size="16" fill="#39ff14" xml:space="preserve" opacity=".9">     /  _______________  \</text><text x="50" y="98" font-size="16" fill="#39ff14" xml:space="preserve" opacity=".9">    |  |   C  S  I  A   |  |</text><text x="50" y="118" font-size="16" fill="#39ff14" xml:space="preserve" opacity=".9">    |  |_______________|  |</text><text x="50" y="138" font-size="16" fill="#00e5ff" xml:space="preserve" opacity=".9">    |   \             /   |</text><text x="50" y="158" font-size="16" fill="#00e5ff" xml:space="preserve" opacity=".9">     \   \    ___    /   /</text><text x="50" y="178" font-size="16" fill="#00e5ff" xml:space="preserve" opacity=".9">      \   \  /   \  /   /</text><text x="50" y="198" font-size="16" fill="#00e5ff" xml:space="preserve" opacity=".9">       '.  \/     \/  .'</text><text x="50" y="218" font-size="16" fill="#00e5ff" xml:space="preserve" opacity=".9">         '-.._____..-'</text>
<line x1="420" y1="36" x2="420" y2="224" stroke="#00e5ff" stroke-opacity=".35" stroke-dasharray="4 6"/>
<text class="t1" x="450" y="86" font-size="20"><tspan fill="#39ff14">csia@rise:~$ </tspan><tspan fill="#e4fff0">echo $SLOGAN</tspan></text>
<text class="t2" x="450" y="130" font-size="22" font-weight="700" fill="#00e5ff">SHIELD UP. MINDS ON. TOGETHER WE RISE.</text>
<text class="t3" x="450" y="174" font-size="20" fill="#a9bdd0">&gt; signal stays open. welcome to the mesh.</text>
<text x="450" y="216" font-size="20"><tspan fill="#39ff14">csia@rise:~$ </tspan><tspan class="blink" fill="#39ff14">█</tspan></text>
