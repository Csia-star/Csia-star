.rise{animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-460px);opacity:0}}
.sg{animation:sg 6s steps(1) infinite}
@keyframes sg{0%,70%,100%{transform:translate(0,0)}71%{transform:translate(-14px,0)}73%{transform:translate(10px,0)}75%{transform:translate(0,0)}}
</style>

