<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">CSIA terminal</title><desc id="d">A terminal types: whoami, CSIA — cyber security and artificial intelligence; ls /cells, 6 cells detected, 0 boring; sudo ./unlock --limits, permission granted, limits: none.</desc>
<defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.flk{animation:flk 3.4s steps(1) infinite}
@keyframes flk{0%{opacity:.55}6%{opacity:.12}8%{opacity:.65}52%{opacity:.5}55%{opacity:.1}58%{opacity:.6}100%{opacity:.55}}
.dash{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.l0{animation:l0 14s steps(1) infinite}@keyframes l0{0%,4%{opacity:0}5%,94%{opacity:1}95%,100%{opacity:0}}
.l1{animation:l1 14s steps(1) infinite}@keyframes l1{0%,14%{opacity:0}15%,94%{opacity:1}95%,100%{opacity:0}}
.l2{animation:l2 14s steps(1) infinite}@keyframes l2{0%,28%{opacity:0}29%,94%{opacity:1}95%,100%{opacity:0}}
.l3{animation:l3 14s steps(1) infinite}@keyframes l3{0%,38%{opacity:0}39%,94%{opacity:1}95%,100%{opacity:0}}
.l4{animation:l4 14s steps(1) infinite}@keyframes l4{0%,52%{opacity:0}53%,94%{opacity:1}95%,100%{opacity:0}}
.l5{animation:l5 14s steps(1) infinite}@keyframes l5{0%,62%{opacity:0}63%,94%{opacity:1}95%,100%{opacity:0}}
.l6{animation:l6 14s steps(1) infinite}@keyframes l6{0%,76%{opacity:0}77%,94%{opacity:1}95%,100%{opacity:0}}
.cur{animation:cur 14s steps(1) infinite}@keyframes cur{0%,76%{opacity:0}77%,80%{opacity:1}81%,84%{opacity:0}85%,88%{opacity:1}89%,92%{opacity:0}93%,94%{opacity:1}95%,100%{opacity:0}}</style>

<rect width="1200" height="450" fill="#060912"/>
<text x="1160" y="430" font-size="170" font-weight="800" text-anchor="end" fill="none" stroke="#a855f7" stroke-opacity=".16" stroke-width="1.5">CSIA</text>
<text class="l0" x="48" y="120" font-size="24" xml:space="preserve"><tspan fill="#39ff14" font-weight="400">$ </tspan><tspan fill="#e4fff0" font-weight="400">whoami</tspan></text>
<text class="l1" x="48" y="160" font-size="24" xml:space="preserve"><tspan fill="#00e5ff" font-weight="400">&gt; </tspan><tspan fill="#39ff14" font-weight="800">CSIA</tspan><tspan fill="#e4fff0" font-weight="400"> — cyber security &amp; artificial intelligence</tspan></text>
<text class="l2" x="48" y="215" font-size="24" xml:space="preserve"><tspan fill="#39ff14" font-weight="400">$ </tspan><tspan fill="#e4fff0" font-weight="400">ls /cells</tspan></text>
<text class="l3" x="48" y="255" font-size="24" xml:space="preserve"><tspan fill="#00e5ff" font-weight="400">&gt; </tspan><tspan fill="#00e5ff" font-weight="700">6 cells detected</tspan><tspan fill="#e4fff0" font-weight="400">. </tspan><tspan fill="#a855f7" font-weight="700">0</tspan><tspan fill="#e4fff0" font-weight="400"> boring.</tspan></text>
<text class="l4" x="48" y="310" font-size="24" xml:space="preserve"><tspan fill="#39ff14" font-weight="400">$ </tspan><tspan fill="#e4fff0" font-weight="400">sudo ./unlock --limits</tspan></text>
<text class="l5" x="48" y="350" font-size="24" xml:space="preserve"><tspan fill="#00e5ff" font-weight="400">&gt; </tspan><tspan fill="#e4fff0" font-weight="400">permission granted. limits: </tspan><tspan fill="#39ff14" font-weight="800">NONE</tspan></text>
<text class="l6" x="48" y="405" font-size="24" xml:space="preserve"><tspan fill="#39ff14" font-weight="400">$ </tspan><tspan fill="#e4fff0" font-weight="400"></tspan></text>

<rect class="cur" x="74" y="386" width="14" height="26" fill="#39ff14"/>
<rect width="1200" height="44" fill="#0a0f1c"/>
<circle cx="24" cy="22" r="6" fill="#a855f7"/><circle cx="46" cy="22" r="6" fill="#00e5ff"/><circle cx="68" cy="22" r="6" fill="#39ff14"/>
<text x="92" y="28" font-size="15" fill="#a9bdd0">csia@mesh:~ — secret_shell</text>
<rect width="1200" height="450" fill="url(#scan)"/>
<rect x=".75" y=".75" width="1198.5" height="448.5" fill="none" stroke="#00e5ff" stroke-opacity=".45"/>

</svg>